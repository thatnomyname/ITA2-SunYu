<html>

<head>

    <style>

  

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: 'Karla', sans-serif;
        }

        a,
        a:hover,
        a:visited {
            color: #0071bc;
        }


        #map {
            top: 0;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }


        #mapInset {

            bottom: 50px;
            right: 30px;

            height: 180px;
            width: 250px;

            max-width: 100%;

            position: fixed;

            z-index: 1;

            opacity: 1;

            transition:
                opacity 0.5s ease-in-out;

            pointer-events: none;

        }

        #mapInset .mapboxgl-ctrl-bottom-left {
            display: none;
        }

        @media (max-width: 500px) {

            #mapInset {
                display: none;
            }

        }


        #header {

            margin: auto;

            width: 100%;

            position: relative;

            z-index: 5;

            padding-top: 35px;
            padding-bottom: 35px;

            background-color:
                rgba(255, 255, 255, 0.96);

        }

        #header h1 {

            margin: 0;

            padding:
                2vh 5vw
                1vh 5vw;

            text-align: center;

            font-size: 40px;

            line-height: 1.2;

            font-weight: 700;

            color: #111111;

        }

        #header h2 {

            max-width: 900px;

            margin: auto;

            padding:
                1vh 10vw;

            text-align: center;

            font-size: 20px;

            line-height: 1.5;

            font-weight: 500;

            color: #555555;

        }

        #header p {

            margin: 0;

            padding-top: 2vh;

            text-align: center;

            font-size: 14px;

            color: #777777;

        }



        #footer {

            width: 100%;

            min-height: 5vh;

            padding-top: 2vh;
            padding-bottom: 2vh;

            text-align: center;

            line-height: 25px;

            font-size: 13px;

            position: relative;

            z-index: 5;

            background-color:
                rgba(255, 255, 255, 0.96);

        }



        #features {

            padding-top: 12vh;

            padding-bottom: 12vh;

        }


        .hidden {
            visibility: hidden;
        }

        .centered {

            width: 50vw;

            max-width: 700px;

            margin: 0 auto;

        }

        .lefty {

            width: 34vw;

            max-width: 520px;

            margin-left: 5vw;

        }

        .righty {

            width: 34vw;

            max-width: 520px;

            margin-left: 61vw;

        }

        .fully {

            width: 100%;

            margin: auto;

        }



        .light {

            background-color:
                rgba(250, 250, 250, 0.94);

        }

        .dark {

            background-color:
                rgba(68, 68, 68, 0.94);

        }



        .step {

            padding-bottom: 42vh;
            opacity: 1;

        }


        .step > div {

            padding:
                26px 40px;

            line-height: 1.65;

            font-size: 14px;

            background-color:
                rgba(250, 250, 250, 0.94);

            transition:

                color 0.25s ease,

                background-color 0.25s ease,

                box-shadow 0.25s ease;

        }




        .step:not(.active) > div {

            color: #aaaaaa;

        }

        .step:not(.active) h3 {

            color: #aaaaaa;

        }

        .step:not(.active) p {

            color: #aaaaaa;

        }


        .step.active > div {

            color: #111111;

            background-color:
                rgba(255, 255, 255, 0.98);

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.08);

        }

        .step.active h3 {

            color: #111111;

        }

        .step.active p {

            color: #222222;

        }


        .step h3 {

            margin-top: 0;

            margin-bottom: 16px;

            font-size: 18px;

            line-height: 1.4;

            font-weight: 700;

            transition:
                color 0.25s ease;

        }



        .step p {

            margin-top: 0;

            margin-bottom: 0;

            font-size: 14px;

            line-height: 1.7;

            transition:
                color 0.25s ease;

        }



        .step img {

            width: 100%;

            margin-top: 12px;

            margin-bottom: 12px;

        }



        @media (max-width: 750px) {

            .centered,
            .lefty,
            .righty,
            .fully {

                width: 88vw;

                margin: 0 auto;

            }

            .step > div {

                padding:
                    22px 25px;

            }

            #header h1 {

                font-size: 30px;

            }

            #header h2 {

                font-size: 17px;

            }

        }



        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,

        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {

            touch-action: unset;

        }

    </style>

<body>


    <div id="map"></div>

    <div id="mapInset"></div>

    <div id="story"></div>

    <div id="experienceHint">
        Click one of the three highlighted attractions to view its word clouds and average tourist score.
    </div>

    <div id="experiencePanel">
        <button class="panel-close" id="experiencePanelClose" aria-label="Close">×</button>
        <h2 id="experienceTitle"></h2>

        <div class="score-box">
            <span class="score-label">Average Score Ranked by Tourists</span>
            <span class="score-value" id="experienceScore"></span>
        </div>

        <div class="wordcloud-block">
            <h3>Overall Perceptions Among Tourists</h3>
            <img id="experienceImage1" alt="Overall perceptions word cloud">
        </div>

        <div class="wordcloud-block">
            <h3>The Purpose of Visitors</h3>
            <img id="experienceImage2" alt="Purpose of visitors word cloud">
        </div>

        <div class="wordcloud-block">
            <h3>Tourist Itineraries</h3>
            <img id="experienceImage3" alt="Tourist itineraries word cloud">
        </div>
    </div>


    <script src="./config.js"></script>


    <script>

        var initLoad = true;

        var currentChapterId = null;

        var originalQualitativePaint = null;

        function captureOriginalQualitativePaint() {

            var layerId = 'tourist-attractions-qualitative';

            if (!map.getLayer(layerId)) {
                return;
            }

            originalQualitativePaint = {
                color:
                    map.getPaintProperty(layerId, 'circle-color'),
                opacity:
                    map.getPaintProperty(layerId, 'circle-opacity'),
                strokeOpacity:
                    map.getPaintProperty(layerId, 'circle-stroke-opacity')
            };
        }


        function restoreQualitativePaint() {

            var layerId = 'tourist-attractions-qualitative';

            if (
                !map.getLayer(layerId)
                ||
                !originalQualitativePaint
            ) {
                return;
            }

            if (originalQualitativePaint.color !== undefined) {
                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    originalQualitativePaint.color
                );
            }

            if (originalQualitativePaint.opacity !== undefined) {
                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    originalQualitativePaint.opacity
                );
            }

            if (originalQualitativePaint.strokeOpacity !== undefined) {
                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    originalQualitativePaint.strokeOpacity
                );
            }
        }


        function applyChapter3Reveal(chapterId) {

            var layerId = 'tourist-attractions-qualitative';

            if (!map.getLayer(layerId)) {
                return;
            }

            map.setFilter(layerId, null);

            var dimColor = '#b8b8b8';

            var cultureColor = '#d97706';
            var natureColor = '#2e8b57';
            var artsColor = '#7c3aed';
            var urbanColor = '#1d4ed8';
            var entertainmentColor = '#db2777';

            var category = ['get', 'category5'];

            var lowOpacity = 0.18;
            var fullOpacity = 0.95;

            if (chapterId === 'chapter-3a') {

                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    dimColor
                );

                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    0.34
                );

                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    0.28
                );

                return;
            }


            if (chapterId === 'chapter-3b') {

                var cultureSelected =
                    ['==', category, 'Culture & Heritage'];

                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    [
                        'case',
                        cultureSelected,
                        cultureColor,
                        dimColor
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    [
                        'case',
                        cultureSelected,
                        fullOpacity,
                        lowOpacity
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    [
                        'case',
                        cultureSelected,
                        0.9,
                        0.12
                    ]
                );

                return;
            }


            if (chapterId === 'chapter-3c') {

                var natureSelected =
                    ['==', category, 'Nature & Parks'];

                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    [
                        'case',
                        natureSelected,
                        natureColor,
                        dimColor
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    [
                        'case',
                        natureSelected,
                        fullOpacity,
                        lowOpacity
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    [
                        'case',
                        natureSelected,
                        0.9,
                        0.12
                    ]
                );

                return;
            }


            if (chapterId === 'chapter-3d') {

                var artsSelected =
                    ['==', category, 'Arts & Museums'];

                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    [
                        'case',
                        artsSelected,
                        artsColor,
                        dimColor
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    [
                        'case',
                        artsSelected,
                        fullOpacity,
                        lowOpacity
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    [
                        'case',
                        artsSelected,
                        0.9,
                        0.12
                    ]
                );

                return;
            }


            if (chapterId === 'chapter-3e') {

                var urbanSelected =
                    ['==', category, 'Urban Attractions & Lifestyle'];

                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    [
                        'case',
                        urbanSelected,
                        urbanColor,
                        dimColor
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    [
                        'case',
                        urbanSelected,
                        fullOpacity,
                        lowOpacity
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    [
                        'case',
                        urbanSelected,
                        0.9,
                        0.12
                    ]
                );

                return;
            }


            if (chapterId === 'chapter-3f') {

                var entertainmentSelected =
                    ['==', category, 'Entertainment & Leisure'];

                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    [
                        'case',
                        entertainmentSelected,
                        entertainmentColor,
                        dimColor
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    [
                        'case',
                        entertainmentSelected,
                        fullOpacity,
                        lowOpacity
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    [
                        'case',
                        entertainmentSelected,
                        0.9,
                        0.12
                    ]
                );

                return;
            }


            if (chapterId === 'chapter-3g') {

                map.setPaintProperty(
                    layerId,
                    'circle-color',
                    [
                        'match',
                        category,

                        'Nature & Parks',
                        natureColor,

                        'Culture & Heritage',
                        cultureColor,

                        'Arts & Museums',
                        artsColor,

                        'Urban Attractions & Lifestyle',
                        urbanColor,

                        'Entertainment & Leisure',
                        entertainmentColor,

                        dimColor
                    ]
                );

                map.setPaintProperty(
                    layerId,
                    'circle-opacity',
                    fullOpacity
                );

                map.setPaintProperty(
                    layerId,
                    'circle-stroke-opacity',
                    0.75
                );

                return;
            }


            restoreQualitativePaint();
        }


        var experienceData = {
            'Sultan Mosque (Masjid Sultan) Singapore': {
                score: '3.2/5',
                images: [
                    './image/Sultan Mosque (Masjid Sultan) Singapore-1.png',
                    './image/Sultan Mosque (Masjid Sultan) Singapore-2.png',
                    './image/Sultan Mosque (Masjid Sultan) Singapore-3.png'
                ]
            },

            'Fort Canning Park': {
                score: '3.7/5',
                images: [
                    './image/Fort Canning Park-1.png',
                    './image/Fort Canning Park-2.png',
                    './image/Fort Canning Park-3.png'
                ]
            },

            'Gardens by the Bay': {
                score: '3.96/5',
                images: [
                    './image/Gardens by the Bay -1.png',
                    './image/Gardens by the Bay -2.png',
                    './image/Gardens by the Bay -3.png'
                ]
            }
        };

        var experiencePanel =
            document.getElementById('experiencePanel');

        var experienceHint =
            document.getElementById('experienceHint');

        document
            .getElementById('experiencePanelClose')
            .addEventListener('click', function () {
                experiencePanel.classList.remove('visible');
            });

        function showExperiencePanel(name) {

            var data = experienceData[name];

            if (!data) {
                console.warn('No Chapter 4 experience data found for:', name);
                return;
            }

            document.getElementById('experienceTitle').textContent = name;
            document.getElementById('experienceScore').textContent = data.score;

            document.getElementById('experienceImage1').src = data.images[0];
            document.getElementById('experienceImage2').src = data.images[1];
            document.getElementById('experienceImage3').src = data.images[2];

            experiencePanel.classList.add('visible');
        }

        function hideExperienceUI() {
            experiencePanel.classList.remove('visible');
            experienceHint.classList.remove('visible');
        }


        function forceChapter4PointsVisible() {

            var layerId = 'tourist-attractions-qualitative';

            if (!map.getLayer(layerId)) {
                return;
            }

  
            restoreQualitativePaint();

 
            map.setFilter(
                layerId,
                [
                    'match',
                    ['get', 'PAGETITLE'],
                    [
                        'Sultan Mosque (Masjid Sultan) Singapore',
                        'Fort Canning Park',
                        'Gardens by the Bay'
                    ],
                    true,
                    false
                ]
            );

            map.setPaintProperty(
                layerId,
                'circle-opacity',
                1
            );

            map.setPaintProperty(
                layerId,
                'circle-stroke-opacity',
                1
            );
        }



        var layerTypes = {

            'fill':
                ['fill-opacity'],

            'line':
                ['line-opacity'],

            'circle':
                [
                    'circle-opacity',
                    'circle-stroke-opacity'
                ],

            'symbol':
                [
                    'icon-opacity',
                    'text-opacity'
                ],

            'raster':
                ['raster-opacity'],

            'fill-extrusion':
                ['fill-extrusion-opacity'],

            'heatmap':
                ['heatmap-opacity']

        };



        var alignments = {

            'left':
                'lefty',

            'center':
                'centered',

            'right':
                'righty',

            'full':
                'fully'

        };


        function getLayerPaintType(layer) {

            var mapLayer =
                map.getLayer(layer);


            if (!mapLayer) {

                console.warn(
                    'Layer not found:',
                    layer
                );

                return [];

            }


            var layerType =
                mapLayer.type;


            return (
                layerTypes[layerType]
                ||
                []
            );

        }


        function setLayerOpacity(layer) {

            var paintProps =
                getLayerPaintType(
                    layer.layer
                );


            paintProps.forEach(
                function (prop) {

                    var options =
                        {};


                    if (layer.duration) {

                        var transitionProp =

                            prop
                            +
                            "-transition";


                        options = {

                            duration:
                                layer.duration

                        };


                        map.setPaintProperty(

                            layer.layer,

                            transitionProp,

                            options

                        );

                    }


                    map.setPaintProperty(

                        layer.layer,

                        prop,

                        layer.opacity,

                        options

                    );

                }
            );

        }



        var story =
            document.getElementById(
                'story'
            );


        var features =
            document.createElement(
                'div'
            );


        features.setAttribute(
            'id',
            'features'
        );


        var header =
            document.createElement(
                'div'
            );


        if (config.title) {

            var titleText =
                document.createElement(
                    'h1'
                );


            titleText.innerText =
                config.title;


            header.appendChild(
                titleText
            );

        }


        if (config.subtitle) {

            var subtitleText =
                document.createElement(
                    'h2'
                );


            subtitleText.innerText =
                config.subtitle;


            header.appendChild(
                subtitleText
            );

        }


        if (config.byline) {

            var bylineText =
                document.createElement(
                    'p'
                );


            bylineText.innerText =
                config.byline;


            header.appendChild(
                bylineText
            );

        }


        if (
            header.innerText.length
            >
            0
        ) {

            header.classList.add(
                config.theme
            );


            header.setAttribute(
                'id',
                'header'
            );


            story.appendChild(
                header
            );

        }



        config.chapters.forEach(
            (record, idx) => {


                var container =
                    document.createElement(
                        'div'
                    );


                var chapter =
                    document.createElement(
                        'div'
                    );


              

                if (record.title) {

                    var title =
                        document.createElement(
                            'h3'
                        );


                    title.innerText =
                        record.title;


                    chapter.appendChild(
                        title
                    );

                }



                if (record.image) {

                    var image =
                        new Image();


                    image.src =
                        record.image;


                    chapter.appendChild(
                        image
                    );

                }


                if (record.description) {

                    var storyText =
                        document.createElement(
                            'p'
                        );


                    storyText.innerHTML =
                        record.description;


                    chapter.appendChild(
                        storyText
                    );

                }


                container.setAttribute(
                    'id',
                    record.id
                );


                container.classList.add(
                    'step'
                );



                if (idx === 0) {

                    container.classList.add(
                        'active'
                    );

                }


                chapter.classList.add(
                    config.theme
                );


                container.appendChild(
                    chapter
                );


                container.classList.add(

                    alignments[
                        record.alignment
                    ]

                    ||

                    'centered'

                );


                if (record.hidden) {

                    container.classList.add(
                        'hidden'
                    );

                }


                features.appendChild(
                    container
                );

            }
        );


        story.appendChild(
            features
        );



        var footer =
            document.createElement(
                'div'
            );


        if (config.footer) {

            var footerText =
                document.createElement(
                    'p'
                );


            footerText.innerHTML =
                config.footer;


            footer.appendChild(
                footerText
            );

        }


        if (
            footer.innerText.length
            >
            0
        ) {

            footer.classList.add(
                config.theme
            );


            footer.setAttribute(
                'id',
                'footer'
            );


            story.appendChild(
                footer
            );

        }



        function updateActiveChapterVisual() {

            var steps =
                document.querySelectorAll(
                    '.step'
                );


            if (
                steps.length === 0
            ) {

                return;

            }


   

            var viewportCenter =
                window.innerHeight
                /
                2;


            var closestStep =
                null;


            var closestDistance =
                Infinity;


            steps.forEach(
                function (step) {


                    var rect =
                        step.getBoundingClientRect();



                    var stepCenter =

                        rect.top

                        +

                        (
                            rect.height
                            /
                            2
                        );


                    var distance =

                        Math.abs(

                            stepCenter

                            -

                            viewportCenter

                        );


                    if (
                        distance
                        <
                        closestDistance
                    ) {

                        closestDistance =
                            distance;


                        closestStep =
                            step;

                    }

                }
            );


     

            steps.forEach(
                function (step) {

                    step.classList.remove(
                        'active'
                    );

                }
            );



            if (closestStep) {

                closestStep.classList.add(
                    'active'
                );

            }

        }


 
        window.addEventListener(

            'scroll',

            updateActiveChapterVisual,

            {
                passive: true
            }

        );




        window.addEventListener(

            'load',

            updateActiveChapterVisual

        );


        mapboxgl.accessToken =
            config.accessToken;



        const transformRequest =
            (url) => {


                const hasQuery =

                    url.indexOf("?")
                    !==
                    -1;


                const suffix =

                    hasQuery

                    ?

                    "&pluginName=scrollytellingV2"

                    :

                    "?pluginName=scrollytellingV2";


                return {

                    url:
                        url
                        +
                        suffix

                };

            };



        var map =
            new mapboxgl.Map({

                container:
                    'map',

                style:
                    config.style,

                center:
                    config
                        .chapters[0]
                        .location
                        .center,

                zoom:
                    config
                        .chapters[0]
                        .location
                        .zoom,

                bearing:
                    config
                        .chapters[0]
                        .location
                        .bearing,

                pitch:
                    config
                        .chapters[0]
                        .location
                        .pitch,

                interactive:
                    false,

                transformRequest:
                    transformRequest

            });



        if (config.inset) {

            var insetMap =
                new mapboxgl.Map({

                    container:
                        'mapInset',

                    style:
                        'mapbox://styles/mapbox/dark-v10',

                    center:
                        config
                            .chapters[0]
                            .location
                            .center,

                    zoom:
                        3,

                    hash:
                        false,

                    interactive:
                        false,

                    attributionControl:
                        false

                });

        }



        if (config.showMarkers) {

            var marker =
                new mapboxgl.Marker({

                    color:
                        config.markerColor

                });


            marker
                .setLngLat(

                    config
                        .chapters[0]
                        .location
                        .center

                )

                .addTo(
                    map
                );

        }



        var scroller =
            scrollama();


        map.on(
            "load",

            function () {

                if (config.projection) {
                    map.setProjection(config.projection);
                }

                captureOriginalQualitativePaint();

                currentChapterId = 'chapter-1';

                if (
                    config.use3dTerrain
                ) {

                    map.addSource(

                        'mapbox-dem',

                        {

                            type:
                                'raster-dem',

                            url:
                                'mapbox://mapbox.mapbox-terrain-dem-v1',

                            tileSize:
                                512,

                            maxzoom:
                                14

                        }

                    );


                    map.setTerrain({

                        source:
                            'mapbox-dem',

                        exaggeration:
                            1.5

                    });

                }


                if (
                    config.inset
                ) {

                    map.on(
                        'move',
                        getInsetBounds
                    );

                }



                if (map.getLayer('tourist-attractions-qualitative')) {

                    map.on(
                        'mouseenter',
                        'tourist-attractions-qualitative',
                        function () {
                            if (currentChapterId === 'chapter-4') {
                                map.getCanvas().style.cursor = 'pointer';
                            }
                        }
                    );

                    map.on(
                        'mouseleave',
                        'tourist-attractions-qualitative',
                        function () {
                            map.getCanvas().style.cursor = '';
                        }
                    );

                    map.on(
                        'click',
                        'tourist-attractions-qualitative',
                        function (e) {

                            if (
                                currentChapterId !== 'chapter-4'
                                ||
                                !e.features
                                ||
                                !e.features.length
                            ) {
                                return;
                            }

                            var feature = e.features[0];
                            var name =
                                feature.properties.PAGETITLE
                                || feature.properties.name
                                || feature.properties.Name;

                            showExperiencePanel(name);
                        }
                    );
                }


                if (
                    map.getLayer(
                        'planning-area-attraction-count-v4 (1)'
                    )
                ) {

                    map.on(
                        'mouseenter',
                        'planning-area-attraction-count-v4 (1)',
                        function () {

                            if (
                                currentChapterId === 'chapter-1'
                                ||
                                currentChapterId === null
                            ) {
                                map.getCanvas().style.cursor = 'pointer';
                            }
                        }
                    );

                    map.on(
                        'mouseleave',
                        'planning-area-attraction-count-v4 (1)',
                        function () {
                            map.getCanvas().style.cursor = '';
                        }
                    );

                    map.on(
                        'click',
                        'planning-area-attraction-count-v4 (1)',
                        function (e) {

                            if (
                                currentChapterId !== 'chapter-1'
                                &&
                                currentChapterId !== null
                            ) {
                                return;
                            }

                            if (
                                !e.features
                                ||
                                !e.features.length
                            ) {
                                return;
                            }

                            var props =
                                e.features[0].properties || {};

                            var areaName =
                                props.PLN_AREA_N
                                ||
                                props.PLN_AREA_C
                                ||
                                'Planning Area';

                            var attractionCount =
                                props.attraction_count;

                            if (
                                attractionCount === undefined
                                ||
                                attractionCount === null
                                ||
                                attractionCount === ''
                            ) {
                                attractionCount = 0;
                            }

                            new mapboxgl.Popup({
                                closeButton: true,
                                closeOnClick: true
                            })
                            .setLngLat(e.lngLat)
                            .setHTML(
                                '<div class="chapter1-popup-title">' +
                                areaName +
                                '</div>' +
                                '<p class="chapter1-popup-count">' +
                                '<strong>' +
                                attractionCount +
                                '</strong><br>' +
                                'tourist attractions' +
                                '</p>'
                            )
                            .addTo(map);
                        }
                    );
                }


                scroller

                    .setup({

                        step:
                            '.step',

                        offset:
                            0.45,

                        progress:
                            true

                    })


                    .onStepEnter(

                        async response => {


                            var current_chapter =

                                config
                                    .chapters
                                    .findIndex(

                                        chap =>

                                            chap.id
                                            ===
                                            response
                                                .element
                                                .id

                                    );


                            var chapter =

                                config
                                    .chapters[
                                        current_chapter
                                    ];



                            map[
                                chapter
                                    .mapAnimation
                                ||
                                'flyTo'
                            ](
                                chapter.location
                            );



                            if (
                                config.inset
                            ) {

                                if (

                                    chapter
                                        .location
                                        .zoom

                                    <

                                    5

                                ) {

                                    insetMap.flyTo({

                                        center:
                                            chapter
                                                .location
                                                .center,

                                        zoom:
                                            0

                                    });

                                }

                                else {

                                    insetMap.flyTo({

                                        center:
                                            chapter
                                                .location
                                                .center,

                                        zoom:
                                            3

                                    });

                                }

                            }



                            if (
                                config.showMarkers
                            ) {

                                marker.setLngLat(

                                    chapter
                                        .location
                                        .center

                                );

                            }


                            currentChapterId = chapter.id;

             
                            if (
                                chapter.id === 'chapter-3a'
                                ||
                                chapter.id === 'chapter-3b'
                                ||
                                chapter.id === 'chapter-3c'
                                ||
                                chapter.id === 'chapter-3d'
                                ||
                                chapter.id === 'chapter-3e'
                                ||
                                chapter.id === 'chapter-3f'
                                ||
                                chapter.id === 'chapter-3g'
                            ) {

                                hideExperienceUI();

                                applyChapter3Reveal(
                                    chapter.id
                                );

                            } else if (
                                chapter.id === 'chapter-4'
                            ) {

                                forceChapter4PointsVisible();

                                experienceHint.classList.add('visible');

                                setTimeout(
                                    function () {
                                        if (currentChapterId === 'chapter-4') {
                                            forceChapter4PointsVisible();
                                        }
                                    },
                                    120
                                );

                                map.once(
                                    'moveend',
                                    function () {
                                        if (currentChapterId === 'chapter-4') {
                                            forceChapter4PointsVisible();
                                        }
                                    }
                                );

                            } else {

                                restoreQualitativePaint();

                                if (
                                    map.getLayer(
                                        'tourist-attractions-qualitative'
                                    )
                                ) {

                                    map.setFilter(
                                        'tourist-attractions-qualitative',
                                        null
                                    );
                                }

                                hideExperienceUI();
                            }


                            if (

                                chapter.onChapterEnter

                                &&

                                chapter
                                    .onChapterEnter
                                    .length
                                >
                                0

                            ) {

                                chapter
                                    .onChapterEnter
                                    .forEach(
                                        setLayerOpacity
                                    );

                            }

                            if (
                                chapter.callback
                            ) {

                                window[
                                    chapter.callback
                                ]();

                            }

                            if (
                                chapter.rotateAnimation
                            ) {

                                map.once(

                                    'moveend',

                                    () => {


                                        const rotateNumber =
                                            map.getBearing();


                                        map.rotateTo(

                                            rotateNumber
                                            +
                                            180,

                                            {

                                                duration:
                                                    30000,

                                                easing:
                                                    function (t) {

                                                        return t;

                                                    }

                                            }

                                        );

                                    }

                                );

                            }

                            if (
                                config.auto
                            ) {

                                var next_chapter =

                                    (
                                        current_chapter
                                        +
                                        1
                                    )

                                    %

                                    config
                                        .chapters
                                        .length;


                                map.once(

                                    'moveend',

                                    () => {

                                        document
                                            .querySelectorAll(

                                                '[data-scrollama-index="' +
                                                next_chapter
                                                    .toString()
                                                +
                                                '"]'

                                            )[0]
                                            .scrollIntoView();

                                    }

                                );

                            }

                        }

                    )


                    .onStepExit(

                        response => {


                            var chapter =

                                config
                                    .chapters
                                    .find(

                                        chap =>

                                            chap.id
                                            ===
                                            response
                                                .element
                                                .id

                                    );


                            if (
                                chapter
                                &&
                                chapter.id === 'chapter-4'
                            ) {
                                hideExperienceUI();
                            }


                            if (

                                chapter

                                &&

                                chapter.onChapterExit

                                &&

                                chapter
                                    .onChapterExit
                                    .length
                                >
                                0

                            ) {

                                if (
                                    !(
                                        chapter.id === 'chapter-3g'
                                        &&
                                        currentChapterId === 'chapter-4'
                                    )
                                ) {

                                    chapter
                                        .onChapterExit
                                        .forEach(
                                            setLayerOpacity
                                        );
                                }

                            }

                        }

                    );


                if (
                    config.auto
                ) {

                    document
                        .querySelectorAll(
                            '[data-scrollama-index="0"]'
                        )[0]
                        .scrollIntoView();

                }

                updateActiveChapterVisual();

            }

        );


        function getInsetBounds() {

            let bounds =
                map.getBounds();


            let boundsJson = {

                type:
                    "FeatureCollection",

                features: [

                    {

                        type:
                            "Feature",

                        properties:
                            {},

                        geometry: {

                            type:
                                "Polygon",

                            coordinates: [

                                [

                                    [
                                        bounds._sw.lng,
                                        bounds._sw.lat
                                    ],

                                    [
                                        bounds._ne.lng,
                                        bounds._sw.lat
                                    ],

                                    [
                                        bounds._ne.lng,
                                        bounds._ne.lat
                                    ],

                                    [
                                        bounds._sw.lng,
                                        bounds._ne.lat
                                    ],

                                    [
                                        bounds._sw.lng,
                                        bounds._sw.lat
                                    ]

                                ]

                            ]

                        }

                    }

                ]

            };


            if (
                initLoad
            ) {

                addInsetLayer(
                    boundsJson
                );


                initLoad =
                    false;

            }

            else {

                updateInsetLayer(
                    boundsJson
                );

            }

        }


        function addInsetLayer(
            bounds
        ) {

            insetMap.addSource(

                'boundsSource',

                {

                    type:
                        'geojson',

                    data:
                        bounds

                }

            );


            insetMap.addLayer(

                {

                    id:
                        'boundsLayer',

                    type:
                        'fill',

                    source:
                        'boundsSource',

                    layout:
                        {},

                    paint: {

                        'fill-color':
                            '#ffffff',

                        'fill-opacity':
                            0.2

                    }

                }

            );


            insetMap.addLayer(

                {

                    id:
                        'outlineLayer',

                    type:
                        'line',

                    source:
                        'boundsSource',

                    layout:
                        {},

                    paint: {

                        'line-color':
                            '#000000',

                        'line-width':
                            1

                    }

                }

            );

        }


        function updateInsetLayer(
            bounds
        ) {

            insetMap

                .getSource(
                    'boundsSource'
                )

                .setData(
                    bounds
                );

        }

        window.addEventListener(

            'resize',

            function () {

                scroller.resize();

                updateActiveChapterVisual();

            }

        );


    </script>

</body>

</html>
